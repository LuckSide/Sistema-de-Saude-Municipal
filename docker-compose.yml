services:
  db:
    image: postgres:17-alpine
    container_name: sistema-saude-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guape}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guape123}
      POSTGRES_DB: ${POSTGRES_DB:-saude_guape}
    ports:
      # Só localhost: banco nunca exposto na rede (reduz superfície das CVEs da imagem postgres).
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guape} -d ${POSTGRES_DB:-saude_guape}"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: "postgres -c shared_preload_libraries=pg_stat_statements -c max_connections=200"

  backend:
    build: ./backend
    image: sistema-saude-backend
    container_name: sistema-saude-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-guape}:${POSTGRES_PASSWORD:-guape123}@db:5432/${POSTGRES_DB:-saude_guape}
      SECRET_KEY: troque-esta-chave-em-producao-32chars-min
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      FIRST_SUPERUSER: admin
      FIRST_SUPERUSER_PASSWORD: admin123
      PEC_DATABASE_URL: postgresql://readonly_user:password@host.docker.internal:5432/pec_db
      PEC_FONTE: auto
      UPDATE_ENABLED: "false"
      UPDATE_BRANCH: "main"
      GITHUB_OWNER: "LuckSide"
      GITHUB_REPO: "Sistema-de-Saude-Municipal"
      # Token p/ repo privado (nunca commitar valor real — só via .env/servidor):
      # GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      REPO_DIR: /repo
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/code/app
      # Repo raiz p/ auto-update (git pull + compose). Monta raiz p/ `git -C /repo` funcionar.
      # Produção: garanta mesma pasta no host (ou ajuste REPO_DIR). Sem .:/app p/ não mascarar código.
      # RISCO: docker.sock = controle total do host. Habilite só em servidor próprio
      # com UPDATE_ENABLED=true + endpoint restrito a superuser, ou remova as 2 linhas.
      - .:/repo
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build: ./frontend
    image: sistema-saude-frontend
    container_name: sistema-saude-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
