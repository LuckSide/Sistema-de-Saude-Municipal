services:
  db:
    image: postgres:17-alpine
    container_name: sistema-saude-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guape}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-saude_guape}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guape} -d ${POSTGRES_DB:-saude_guape}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c max_connections=200
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=8MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: sistema-saude-backend:prod
    container_name: sistema-saude-api-prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-guape}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-saude_guape}
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY com no minimo 32 caracteres no arquivo .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:-admin}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?Defina FIRST_SUPERUSER_PASSWORD segura no .env}
      PEC_DATABASE_URL: ${PEC_DATABASE_URL:-}
      PEC_FONTE: ${PEC_FONTE:-auto}
      DB_POOL_SIZE: 30
      DB_MAX_OVERFLOW: 50
      DB_POOL_TIMEOUT: 30
      DB_POOL_RECYCLE: 1800
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_TIMEOUT: 120
      GUNICORN_KEEPALIVE: 65
    command: ["python", "-m", "gunicorn", "-c", "gunicorn_conf.py", "app.main:app"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\")'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: sistema-saude-frontend:prod
    container_name: sistema-saude-web-prod
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PORT_HTTP:-80}:80"
      - "${PORT_HTTPS:-443}:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
