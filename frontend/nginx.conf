user nginx;
worker_processes auto;
pid /run/nginx.pid;

error_log /var/log/nginx/error.log notice;

events {
  worker_connections 1024;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  client_max_body_size 64m;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  # Compressão Gzip para economia de banda e alta performance
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_buffers 16 8k;
  gzip_http_version 1.1;
  gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    text/javascript
    image/svg+xml;

  # Rate limiting para proteção contra ataques de força bruta e DoS
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=40r/s;
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
  limit_req_status 429;

  # Resolve backend em tempo de execução p/ não dar emerg se subir antes do backend
  resolver 127.0.0.11 valid=30s;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos de Segurança HTTP
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://api.qrserver.com; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self'; font-src 'self' data: https://fonts.gstatic.com" always;

    # NOTA nginx: add_header dentro de location SUBSTITUI os do server.
    # Por isso cada location com cache próprio repete os headers de segurança.
    location / {
      # index.html sempre fresco: referencia os hashes novos a cada deploy.
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
      add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://api.qrserver.com; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self'; font-src 'self' data: https://fonts.gstatic.com" always;
      try_files $uri $uri/ /index.html;
    }

    # Assets com hash no nome são imutáveis: cache longo no navegador (1 ano).
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
      add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://api.qrserver.com; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self'; font-src 'self' data: https://fonts.gstatic.com" always;
    }

    # Rate limiting estrito para autenticação (proteção contra força bruta em senhas)
    location ~ ^/api/(token/?|auth/token) {
      limit_req zone=auth_limit burst=10 nodelay;

      set $upstream_backend http://backend:8000;
      proxy_pass $upstream_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_read_timeout 60s;
      proxy_connect_timeout 30s;
    }

    # Proxy reverso para todas as rotas da API com rate limiting geral e buffers otimizados
    location /api/ {
      limit_req zone=api_limit burst=60 nodelay;

      set $upstream_backend http://backend:8000;
      proxy_pass $upstream_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;

      # Buffers de resposta ASGI
      proxy_buffering on;
      proxy_buffer_size 128k;
      proxy_buffers 4 256k;
      proxy_busy_buffers_size 256k;
      proxy_read_timeout 120s;
      proxy_connect_timeout 30s;
      proxy_send_timeout 60s;
    }
  }
}
